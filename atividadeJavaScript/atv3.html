<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <h1 id="texto">Titulo Inicial</h1>
    
    <script>

        let txt = document.querySelector("#texto")
        const num = Math.random(30, 100) * (100 - 30) + 30;

        txt.style.color = "blue";
        txt.innerText = "Azul";
        txt.style.fontSize = num + 'px';
        
    </script>
</body>
</html>
